name: Publish GitHub Pages mirror

# Mirrors the reviewed dist/ into the public repository ingunbi/shanghai-2026,
# served at https://ingunbi.github.io/shanghai-2026/ (reachable from mainland China).
on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'scripts/validate-public-site.mjs'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shanghai-pages
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository == 'ingunbi/shanghai-tech-2026' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out public site source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: source
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Validate public assets
        working-directory: source
        run: node scripts/validate-public-site.mjs
      - name: Check out Pages repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ingunbi/shanghai-2026
          ssh-key: ${{ secrets.PAGES_DEPLOY_KEY }}
          path: pages
      - name: Push dist/ to Pages repository
        working-directory: pages
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R ../source/dist/. .
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then echo "Pages already current"; exit 0; fi
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -m "Publish ${SOURCE_SHA::12}"
          git push origin HEAD:main
