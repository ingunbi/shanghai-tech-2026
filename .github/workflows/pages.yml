name: Publish Shanghai site

# Validates dist/ and publishes it with GitHub Pages:
# https://ingunbi.github.io/shanghai-tech-2026/
on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'scripts/validate-public-site.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'ingunbi/shanghai-tech-2026' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Validate public assets
        run: node scripts/validate-public-site.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload dist/
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
